name: Mirror Toolbox Changelog Trigger

on:
  pull_request:
    types: [opened, edited]

permissions: {}

jobs:
  trigger:
    # Renovate groups the npm toolbox update under groupName 'toolbox' (see
    # renovate.json5), so its branch is renovate/toolbox.
    if: github.actor == 'renovate-bot' && startsWith(github.head_ref, 'renovate/toolbox')
    runs-on: ubuntu-latest
    steps:
      - name: Save PR metadata
        env:
          PR_NUMBER: ${{ github.event.pull_request.number }}
        run: |
          mkdir -p metadata
          echo "$PR_NUMBER" > metadata/pr_number.txt

      - name: Upload PR metadata artifact
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: pr-metadata
          path: metadata/
          retention-days: 1
